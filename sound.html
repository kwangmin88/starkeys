<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>소리 점검</title>
<style>body{margin:0;padding:18px 16px 40px;background:#140a2a;color:#fff;font:16px/1.5 -apple-system,'Apple SD Gothic Neo',sans-serif}
h1{font-size:21px;margin:0 0 4px}p{margin:4px 0 14px;opacity:.75;font-size:14px}
button{display:block;width:100%;margin:10px 0 4px;padding:18px;border:0;border-radius:14px;font:700 18px inherit;color:#fff;background:#7b3bff}
.r{font-size:15px;min-height:22px;color:#9fffb0}#info{margin-top:22px;font:12px/1.5 monospace;opacity:.7;word-break:break-all;white-space:pre-wrap}</style></head><body>
<h1>소리 점검</h1><p>버튼을 1번부터 차례로 눌러 보고, 소리가 난 번호를 알려 주세요.</p>
<button id=b1>1. 삐 소리 (웹오디오)</button><div class=r id=r1></div>
<button id=b2>2. 노래 (일반 오디오 재생)</button><div class=r id=r2></div>
<button id=b3>3. 노래 (게임과 같은 방식)</button><div class=r id=r3></div>
<button id=b4 style="background:#444">모두 멈춤</button>
<div id=info></div>
<script>
const SONG='https://starkeys-songs.km46170008.workers.dev/audio/k01.m4a';
let ac=null; const getAc=()=>{ if(!ac){ try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){} ac=new (window.AudioContext||window.webkitAudioContext)(); } return ac; };
const info=()=>{ document.getElementById('info').textContent='기기: '+navigator.userAgent+'\n세션: '+(navigator.audioSession?navigator.audioSession.type:'없음')+'\n웹오디오: '+(ac?ac.state+' '+ac.currentTime.toFixed(1)+'s':'아직')+'\n화면 크기: '+innerWidth+'x'+innerHeight; };
setInterval(info,500); info();
const say=(i,t)=>document.getElementById('r'+i).textContent=t;
b1.onclick=async()=>{ try{ const c=getAc(); await c.resume(); const o=c.createOscillator(), g=c.createGain(); g.gain.value=.3; o.frequency.value=660; o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+.6); say(1,'틀었음 · 상태 '+c.state); }catch(e){ say(1,'오류: '+e); } };
let el=null;
b2.onclick=async()=>{ try{ el=el||new Audio(SONG); el.currentTime=40; await el.play(); say(2,'재생 중 (일반 오디오)'); }catch(e){ say(2,'오류: '+e); } };
let src=null;
b3.onclick=async()=>{ try{ const c=getAc(); await c.resume(); say(3,'노래 받는 중…'); const buf=await (await fetch(SONG)).arrayBuffer(); say(3,'푸는 중… '+Math.round(buf.byteLength/1024)+'KB'); const b=await c.decodeAudioData(buf); src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(0,40); say(3,'재생 중 · '+Math.round(b.duration)+'초짜리 · 상태 '+c.state); }catch(e){ say(3,'오류: '+e); } };
b4.onclick=()=>{ try{el&&el.pause();}catch(e){} try{src&&src.stop();}catch(e){} };
</script></body></html>
